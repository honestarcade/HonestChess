name: honest_chess
description: "Honest Chess — chess for Android, fully offline. No ads, no tracking, no permissions."
publish_to: 'none' # never published to pub.dev

# The version name is the release tag's; CI sets the version code
# (tools/ci_version.sh), so the +1 here is only a local build's.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test: # why: device-level tests on an emulator (#38); SDK, dev only
    sdk: flutter
  # Test-only: dev_dependencies are not compiled into the release bundle.
  yaml: ^3.1.4 # why: guards read YAML structurally; a line scan misreads it

flutter:
  uses-material-design: true

  # Bundled, never fetched (invariant 1); sources and hashes in
  # assets/fonts/SOURCE.md. The OFL texts are assets so the licence page can
  # read them. The audio clips are listed one by one, never as the directory,
  # so LICENSES.md and PROMPTS.md beside them stay out of the app;
  # test/guards/audio_assets_test.dart holds this list to
  # lib/feedback/clips.dart.
  assets:
    - assets/fonts/outfit/OFL.txt
    - assets/fonts/plexmono/OFL.txt
    - assets/fonts/pieces/OFL.txt
    - assets/audio/move.wav
    - assets/audio/capture.wav
    - assets/audio/castle.wav
    - assets/audio/check.wav
    - assets/audio/end.wav
    - assets/audio/music.wav

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/plexmono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/plexmono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/plexmono/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: HonestPieces
      fonts:
        - asset: assets/fonts/pieces/HonestPieces.ttf
