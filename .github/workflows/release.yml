# Pushing a version tag ships.
#
# The order is the safety property: the identical gate re-runs on the tagged
# commit, then the bundle is built from secrets, scanned for permissions, and
# its signing certificate checked against the committed one — and only then
# is anything published. test/guards/release_workflow_test.dart asserts that
# order, and that none of those steps can be skipped.
#
# Production is never touched here. The upload track is `internal`, and
# promotion to closed testing is a separate, manually dispatched workflow.
#
# Secrets are supplied as step-level `env:` on the steps that need them, never
# job-wide, so a step with no business seeing the keystore password does not
# have it in scope. test/guards/workflow_secrets_test.dart asserts that, and
# refuses shell tracing in every workflow and in tools/.
name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    # The same file the pull-request gate uses, not a copy of its steps.
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  ship:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write    # release asset upload only
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      # Before anything else: Play refuses a com.example.* id, but only after
      # a signed bundle has been built and uploaded to it.
      - id: identity
        name: Refuse the template's placeholder identity
        run: tools/release_identity.sh

      # First, so a missing secret fails in seconds rather than after a build.
      # Each is tested for emptiness; none is printed.
      - id: secrets_present
        name: Assert every secret is present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          HS_KEYSTORE_B64: ${{ secrets.HS_KEYSTORE_B64 }}
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
        run: |
          set -euo pipefail
          missing=""
          for name in PLAY_SERVICE_ACCOUNT_JSON HS_KEYSTORE_B64 HS_KEYSTORE_PASS HS_KEY_ALIAS HS_KEY_PASS; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "missing repository secrets:$missing" >&2
            exit 1
          fi
          echo "all five secrets are present"

      # Refuses a malformed tag before anything is built. stdout is the
      # contract; it is tee'd so the log shows what the next steps will use.
      - id: version
        name: Resolve version from tag
        run: |
          set -euo pipefail
          tools/ci_version.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" \
            | tee -a "$GITHUB_OUTPUT"

      - id: java
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - id: flutter
        name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - id: deps
        name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - id: keystore
        name: Decode the upload keystore
        env:
          HS_KEYSTORE_B64: ${{ secrets.HS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          base64 -d <<< "$HS_KEYSTORE_B64" > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"

      # Proves the decoded file is a keystore and that the store password
      # opens it, before the build discovers otherwise.
      - id: keystore_check
        name: Check the keystore opens
        env:
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
        run: |
          set -euo pipefail
          # A PKCS12 keystore has one password: keytool ignores `-keypass` and
          # exits 0 whatever it is given, so no command can prove the key
          # password. Asserting the two secrets agree is the check that CAN
          # fail.
          if [ "$HS_KEY_PASS" != "$HS_KEYSTORE_PASS" ]; then
            echo "HS_KEY_PASS differs from HS_KEYSTORE_PASS." >&2
            echo "  A PKCS12 keystore has one password; Gradle would fail with" >&2
            echo "  UnrecoverableKeyException four minutes into the build." >&2
            exit 1
          fi
          # `-alias`, so a keystore without the configured alias fails here
          # rather than in the build.
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
            -storetype PKCS12 -storepass:env HS_KEYSTORE_PASS \
            -alias "$HS_KEY_ALIAS" > /dev/null
          echo "the keystore opens, and holds the configured alias"

      # HS_RELEASE=1 makes a missing signing input a hard failure in
      # build.gradle.kts rather than a silent fall back to the debug key.
      - id: build
        name: Build the signed bundle
        env:
          HS_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
          HS_RELEASE: "1"
        # No --no-pub: the build must regenerate the plugin registrant for
        # release, which leaves dev-only plugins (integration_test, #38) out;
        # tools/gate.sh has the same rule and the reason.
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - id: scan
        name: Scan the bundle for permissions
        run: tools/check_aab.sh

      - id: cert
        name: Verify the signing certificate
        run: tools/verify_upload_cert.sh

      # Written here rather than in the asset step, so the artifact carries it
      # even on a tag with no GitHub release.
      - id: sidecar
        name: Write the checksum sidecar
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          sha256sum "$aab" > "$aab.sha256"
          cat "$aab.sha256"

      - id: artifact
        name: Upload the signed bundle as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-signed-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          retention-days: 30
          if-no-files-found: error

      # A tag with no GitHub release is skipped, not failed; see the script.
      - id: asset
        name: Attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/attach_release_asset.sh "$GITHUB_REF_NAME"

      # Last, so that every verification above has already passed.
      - id: play
        name: Upload to the Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Written by tools/rename_app.py.
          packageName: com.honestarcade.chess
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - id: summary
        name: Write the summary
        if: always()
        # TAG through env, never interpolated into the script: GitHub pastes
        # `${{ }}` in as text before bash runs, and `v1.0.0$(id)` is a legal
        # tag name that matches this workflow's own trigger.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          {
            echo "### Release $TAG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version name | ${{ steps.version.outputs.name }} |"
            echo "| version code | ${{ steps.version.outputs.code }} |"
            echo "| package | com.honestarcade.chess |"
            echo "| track | internal |"
            if [ -f "$aab" ]; then
              echo "| bundle SHA-256 | $(sha256sum "$aab" | cut -d' ' -f1) |"
            fi
            echo ""
            echo "Native debug symbols are not uploaded: this is a Flutter"
            echo "default build with no obfuscation mapping to attach."
            if [ -f "$RUNNER_TEMP/no-release-note" ]; then
              echo ""
              cat "$RUNNER_TEMP/no-release-note"
            fi
            echo ""
            echo "Play Console: https://play.google.com/console"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: name_failure
        name: Name the failed step
        if: failure()
        run: |
          set -euo pipefail
          echo '${{ toJSON(steps) }}' \
            | grep -B2 '"outcome": "failure"' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      # Always, including after a failure: a decoded keystore must not outlive
      # the job on a runner, however the job ended.
      - id: shred
        name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  report-gate-failure:
    needs: gate
    # `needs.gate.result` rather than `failure()`, so a cancelled gate counts
    # too. Even so, GitHub skips the dependents of a cancelled job rather than
    # evaluating their `if:`, so a cancelled gate may announce nothing here.
    # Nothing ships either way: `ship` needs the gate.
    if: needs.gate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: say
        name: Say nothing shipped
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "gate failed on $TAG; nothing shipped" \
            | tee -a "$GITHUB_STEP_SUMMARY"
