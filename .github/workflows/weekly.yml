# The scheduled home for tests too slow for the pull-request gate (#37): the
# `weekly` tag, which tools/gate.sh excludes. tools/weekly_tests.sh runs them
# and fails if none ran, so this job can never go green by testing nothing.
#
# Scheduled weekly (#69) so the strength dial's ladder — each step beating
# the one below it — is proven again every week, not only when someone asks.
name: Weekly tests

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests
  # Both runs would test the same default branch; let the first finish.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      # flutter-version-file reads .fvmrc, the single place the exact version
      # is pinned, so this runs the Flutter the pull-request gate runs.
      - id: flutter
        name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - id: deps
        name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - id: weekly
        name: Weekly tests
        run: tools/weekly_tests.sh

      - id: summary
        name: Write the summary
        if: always()
        env:
          OUTCOME: ${{ steps.weekly.outcome }}
        run: |
          {
            echo "### Weekly tests: $OUTCOME"
            echo
            echo "The counts, and any empty-run refusal, are above: tools/counted_tests.sh"
            echo "writes them to this summary."
          } >> "$GITHUB_STEP_SUMMARY"
